<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04121f" />
    <meta
      name="description"
      content="Tu mascota es tu cuerpo: se pone feliz cuando tomas agua y te dice de verdad como estas por dentro. Funciona en Android y iPhone."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mascota Agua" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <title>Mascota de Agua</title>
    <style>
      /* Pantalla de arranque instantanea: React la reemplaza al montar. */
      #arranque {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 80% at 50% -10%, #0e4f7a 0%, #062032 55%, #04121f 100%);
      }
      #arranque .gota {
        width: 74px;
        height: 74px;
        border-radius: 50% 50% 50% 0;
        transform: rotate(135deg);
        background: linear-gradient(150deg, #7fdcff, #2b9fd8 60%, #1d6fa5);
        box-shadow: 0 18px 44px rgba(43, 159, 216, 0.45);
        animation: latir 1.6s ease-in-out infinite;
      }
      @keyframes latir {
        0%,
        100% {
          transform: rotate(135deg) scale(1);
        }
        50% {
          transform: rotate(135deg) scale(1.08);
        }
      }
      #arranque p {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(191, 232, 255, 0.75);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="arranque">
        <div class="gota"></div>
        <p>Mascota de Agua</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
